sensor:
  - platform: ads1115
    ads1115_id: ads1
    multiplexer: A0_GND
    gain: 6.144
    id: nd_mode_v
    name: "ND Mode (V)"
    update_interval: 100ms
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - delta: 0.1

  - platform: copy
    source_id: nd_mode_v
    id: nd_mode
    name: "ND Mode"
    accuracy_decimals: 0
    filters:
      - lambda: |-
          const float VMIN = 0.00f, VMAX = 3.28f; const int N = 5; // LS..PLAN, measured 2026-11-03
          int p = (int) roundf((x - VMIN) / (VMAX - VMIN) * (N - 1));
          return (float) (p < 0 ? 0 : (p > N - 1 ? N - 1 : p));
      - delta: 0.5
    on_value:
      - xplane_client.set_dataref:
          id: xp
          dataref: "AirbusFBW/NDmodeCapt"
          value: !lambda "return (int) x;"

  # --- EFIS ND RANGE selector: 6-position resistor-ladder rotary -> AirbusFBW/NDrangeCapt ------
  - platform: ads1115
    ads1115_id: ads1
    multiplexer: A1_GND
    gain: 6.144
    id: nd_range_v
    name: "ND Range (V)"
    update_interval: 100ms
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - delta: 0.1 # dead-band: ignore sub-0.1V jitter (detents are ~0.9V apart)

  # Position 0..N-1 from the volts above. `delta: 0.5` = only fires when the position changes.
  - platform: copy
    source_id: nd_range_v
    id: nd_range
    name: "ND Range"
    accuracy_decimals: 0
    filters:
      - lambda: |-
          const float VMIN = 0.10f; // volts at position 0   (CHANGE_ME)
          const float VMAX = 3.28f; // volts at position 5   (CHANGE_ME)
          const int N = 6;
          int p = (int) roundf((x - VMIN) / (VMAX - VMIN) * (N - 1));
          return (float) (p < 0 ? 0 : (p > N - 1 ? N - 1 : p));
      - delta: 0.5
    on_value:
      - xplane_client.set_dataref:
          id: xp
          dataref: "AirbusFBW/NDrangeCapt"
          value: !lambda "return (int) x;"

  # --- VOR/ADF 1 selector: 3-position ladder (VOR/OFF/ADF) -> explicit per-position command -----
  - platform: ads1115
    ads1115_id: ads1
    multiplexer: A2_GND
    gain: 6.144
    id: voradf1_v
    name: "VOR/ADF 1"
    update_interval: 100ms
    filters:
      - median:
          window_size: 5
          send_every: 1 # emit every 100ms (was 7 = ~700ms lag), still median-of-5 smoothed
          send_first_at: 1
      - delta: 0.1 # dead-band: ignore sub-0.1V jitter (detents are ~0.9V apart)
      - lambda: |-
          const float VMIN = 0.00f; // CHANGE_ME
          const float VMAX = 3.28f; // CHANGE_ME
          const int N = 3;
          int p = (int) roundf((x - VMIN) / (VMAX - VMIN) * (N - 1));
          return (float) (p < 0 ? 0 : (p > N - 1 ? N - 1 : p));
      - delta: 0.5 # only pass when the quantised index changes
    on_value:
      - if:
          condition:
            lambda: "return (int) x == 0;"
          then:
            - xplane_client.send_command:
                id: xp
                command: "sim/instruments/EFIS_1_pilot_sel_adf"
      - if:
          condition:
            lambda: "return (int) x == 1;"
          then:
            - xplane_client.send_command:
                id: xp
                command: "sim/instruments/EFIS_1_pilot_sel_off"
      - if:
          condition:
            lambda: "return (int) x == 2;"
          then:
            - xplane_client.send_command:
                id: xp
                command: "sim/instruments/EFIS_1_pilot_sel_vor"

  # --- VOR/ADF 2 selector: 3-position ladder (VOR/OFF/ADF) -> explicit per-position command -----
  - platform: ads1115
    ads1115_id: ads1
    multiplexer: A3_GND
    gain: 6.144
    id: voradf2_v
    name: "VOR/ADF 2"
    update_interval: 100ms
    filters:
      - median:
          window_size: 5
          send_every: 1 # emit every 100ms (was 7 = ~700ms lag), still median-of-5 smoothed
          send_first_at: 1
      - delta: 0.1 # dead-band: ignore sub-0.1V jitter (detents are ~0.9V apart)
      - lambda: |-
          const float VMIN = 0.00f; // CHANGE_ME
          const float VMAX = 3.28f; // CHANGE_ME
          const int N = 3;
          int p = (int) roundf((x - VMIN) / (VMAX - VMIN) * (N - 1));
          return (float) (p < 0 ? 0 : (p > N - 1 ? N - 1 : p));
      - delta: 0.5
    on_value:
      - if:
          condition:
            lambda: "return (int) x == 0;"
          then:
            - xplane_client.send_command:
                id: xp
                command: "sim/instruments/EFIS_2_pilot_sel_adf"
      - if:
          condition:
            lambda: "return (int) x == 1;"
          then:
            - xplane_client.send_command:
                id: xp
                command: "sim/instruments/EFIS_2_pilot_sel_off"
      - if:
          condition:
            lambda: "return (int) x == 2;"
          then:
