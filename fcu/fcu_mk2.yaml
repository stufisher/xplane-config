    restore_value: false
    initial_value: '0'
  - id: disp1_last_update
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: disp3_last_update
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: disp4_last_update
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: xp_connected
    type: bool
    restore_value: no
    initial_value: "false"


