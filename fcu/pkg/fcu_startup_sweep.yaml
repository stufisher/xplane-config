# FCU Mk2 startup sweep: a band of light runs left to right across the panel, each lamp fading on
# and off again as it passes, then runs back right to left, then all stay off. Backlights peak at
# 0.1, status lamps and korries at full brightness. If X-Plane connects, the sweep stops: every
# lamp is cleared, then set from the sim again (backlights from the panel brightness).
# Include from the FCU config (xplane-config fcu/fcu_mk2.yaml), which defines the ids used here:
#   packages:
#     startup_sweep: !include pkg/fcu_startup_sweep.yaml
#
# Order and timing follow each lamp's x position in fcu_mk2/front_panel.scad (mm, panel
# coordinates: EFIS panel -100..0, main panel 0..260, ECAM panel 260..360). A button's status lamp
# and backlight share its x, both lamps of a korry light together, and the ECAM columns light both
# rows together. Runs once per boot.
interval:
  - interval: 20ms
    then:
      - lambda: |-
          struct Lamp { output::FloatOutput *out; float x; float max; };
          const float bk = 0.1f;  // backlight peak
          static const Lamp lamps[] = {
            // EFIS option buttons, TERR ON ND and GPWS korries
            {id(cstr_bk_out), -80, bk}, {id(cstr_stat_out), -80, 1},
            {id(wpt_bk_out), -65, bk}, {id(wpt_stat_out), -65, 1},
            {id(vord_bk_out), -50, bk}, {id(vord_stat_out), -50, 1},
            {id(ndb_bk_out), -35, bk}, {id(ndb_stat_out), -35, 1},
            {id(terr_bk_out), -33, bk}, {id(terr_stat_out), -33, 1},
            {id(arpt_bk_out), -20, bk}, {id(arpt_stat_out), -20, 1},
            {id(gpws_a_out), -13, 1}, {id(gpws_b_out), -13, 1},
            // Main panel: MASTER WARN / CAUT korries (order assumed), CALL, FD, LS, LOC,
            // AP1 / A-THR / AP2, EXPED, APPR
            {id(master_warn_out), 16, 1}, {id(master_caut_out), 36, 1},
            {id(call_bk_out), 55.7, bk}, {id(call_stat_out), 55.7, 1},
            {id(fd_bk_out), 80, bk}, {id(fd_stat_out), 80, 1},
            {id(ls_bk_out), 96, bk}, {id(ls_stat_out), 96, 1},
            {id(loc_bk_out), 147.5, bk}, {id(loc_stat_out), 147.5, 1},
            {id(ap1_bk_out), 172, bk}, {id(ap1_stat_out), 172, 1},
            {id(athr_bk_out), 180, bk}, {id(athr_stat_out), 180, 1},
            {id(ap2_bk_out), 188, bk}, {id(ap2_stat_out), 188, 1},
            {id(exped_bk_out), 212.5, bk}, {id(exped_stat_out), 212.5, 1},
            {id(appr_bk_out), 241.5, bk}, {id(appr_stat_out), 241.5, 1},
            // ECAM: six columns, top/bottom row pairs
            {id(ecam_eng_bk_out), 272.5, bk}, {id(ecam_eng_stat_out), 272.5, 1},
            {id(ecam_apu_bk_out), 272.5, bk}, {id(ecam_apu_stat_out), 272.5, 1},
            {id(ecam_bleed_bk_out), 287.5, bk}, {id(ecam_bleed_stat_out), 287.5, 1},
            {id(ecam_cond_bk_out), 287.5, bk}, {id(ecam_cond_stat_out), 287.5, 1},
            {id(ecam_press_bk_out), 302.5, bk}, {id(ecam_press_stat_out), 302.5, 1},
            {id(ecam_door_bk_out), 302.5, bk}, {id(ecam_door_stat_out), 302.5, 1},
            {id(ecam_elec_bk_out), 317.5, bk}, {id(ecam_elec_stat_out), 317.5, 1},
            {id(ecam_wheel_bk_out), 317.5, bk}, {id(ecam_wheel_stat_out), 317.5, 1},
            {id(ecam_hyd_bk_out), 332.5, bk}, {id(ecam_hyd_stat_out), 332.5, 1},
            {id(ecam_fctl_bk_out), 332.5, bk}, {id(ecam_fctl_stat_out), 332.5, 1},
            {id(ecam_fuel_bk_out), 347.5, bk}, {id(ecam_fuel_stat_out), 347.5, 1},
            {id(ecam_toconfig_bk_out), 347.5, bk}, {id(ecam_toconfig_stat_out), 347.5, 1},
            // Autobrake korries: LO/MED, MAX, BRK FAN
            {id(lomed_on_out), 306, 1}, {id(lomed_decel_out), 306, 1},
            {id(max_a_out), 326, 1}, {id(max_b_out), 326, 1},
            {id(brkfan_on_out), 346, 1}, {id(brkfan_hot_out), 346, 1},
          };
          // Every sim value a lamp follows; re-publishing one re-runs its on_value
          static sensor::Sensor *const sources[] = {
            id(panel_brightness),
            id(cstr_lt), id(wpt_lt), id(vord_lt), id(ndb_lt), id(arpt_lt), id(terr_lt),
            id(gpws_lt_a), id(gpws_lt_b), id(master_warn), id(master_caut),
            id(fd_lt), id(fd_lt2), id(ls_lt), id(loc_lt), id(ap1_lt), id(athr_lt), id(ap2_lt),
            id(fcu_exped), id(appr_lt),
            id(ecam_eng_lt), id(ecam_apu_lt), id(ecam_bleed_lt), id(ecam_cond_lt),
            id(ecam_press_lt), id(ecam_door_lt), id(ecam_elec_lt), id(ecam_wheel_lt),
            id(ecam_hyd_lt), id(ecam_fctl_lt), id(ecam_fuel_lt), id(ecam_toconfig_lt),
            id(lomed_lo), id(lomed_med), id(max_lt_a), id(max_lt_b),
            id(brkfan_on_lt), id(brkfan_t0), id(brkfan_t1), id(brkfan_t2), id(brkfan_t3),
          };
          const float x_min = -80, x_max = 347.5;
          const float band_mm = 60;        // half-width of the lit band: fades over this distance
          const uint32_t pass_ms = 1500;   // one pass across the panel, band fully in to fully out

          static uint32_t start = 0;
          static bool swept = false;     // both passes done, lamps left off
          static bool finished = false;  // handed over to the sim
          if (finished)
            return;

          if (id(xp_connected)) {
            // Hand over: clear every lamp, then let each lamp's own logic set it from the sim.
            // Re-publishing skips filters (e.g. panel_brightness's delta), so a repeat isn't dropped.
            for (const auto &l : lamps)
              l.out->set_level(0.0f);
            for (auto *s : sources)
              if (s->has_state())
                s->internal_send_state_to_frontend(s->state);
            finished = true;
            return;
          }

          if (swept)
            return;
          if (start == 0)
            start = millis();
          uint32_t elapsed = millis() - start;
          if (elapsed >= 2 * pass_ms) {
            for (const auto &l : lamps)
              l.out->set_level(0.0f);
            swept = true;
            return;
          }

          // Band centre travels from just off one edge to just off the other, so every lamp fades
          // fully in and out: left to right on the first pass, back on the second
          const float from = x_min - band_mm, to = x_max + band_mm;
          float t = (elapsed % pass_ms) / (float) pass_ms;
          float centre = elapsed < pass_ms ? from + t * (to - from) : to - t * (to - from);
          for (const auto &l : lamps) {
            float d = std::fabs(l.x - centre);
            l.out->set_level(d >= band_mm ? 0.0f : l.max * (1.0f - d / band_mm));
          }
