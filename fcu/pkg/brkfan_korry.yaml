# Reusable (single-use): the BRK FAN korry. Matrix button + ON lamp + the SPECIAL HOT lamp.
# HOT can't use korry_2lamp because it's a 4-element array OR (no single "brakes hot" dataref exists):
# it watches AirbusFBW/BrakeTemperatureArray[0..3] and lights when ANY element > 300.
# NOTE: non-inverted (HIGH on press) - no `invert` filter.
# Block YAML throughout (a flow {} map can't hold a ${name} token).
# Vars: name label row col command on_ch hot_ch
binary_sensor:
  - platform: matrix_keypad
    keypad_id: btn_matrix
    id: ${name}_btn
    name: ${label}
    row: ${row}
    col: ${col}
    on_press:
      - xplane_client.send_command:
          id: xp
          command: ${command}

script:
  # Re-evaluate HOT whenever any of the 4 brake temps updates (ANY > 300 = hot).
  - id: update_${name}_hot
    then:
      - if:
          condition:
            lambda: |-
              return id(${name}_t0).state > 300 || id(${name}_t1).state > 300
                  || id(${name}_t2).state > 300 || id(${name}_t3).state > 300;
          then:
            - output.set_level:
                id: ${name}_hot_out
                level: 100%
          else:
            - output.set_level:
                id: ${name}_hot_out
                level: 0%

sensor:
  # ON lamp: BrakeFan != 0
  - platform: xplane_client
    dataref: "AirbusFBW/BrakeFan"
    id: ${name}_on_lt
    internal: true
    on_value:
      - if:
          condition:
            lambda: "return x != 0;"
          then:
            - output.set_level:
                id: ${name}_on_out
                level: 100%
          else:
            - output.set_level:
                id: ${name}_on_out
                level: 0%
  # HOT inputs: one sensor per BrakeTemperatureArray element, each kicks the OR script.
  - platform: xplane_client
    dataref: "AirbusFBW/BrakeTemperatureArray"
    index: 0
    id: ${name}_t0
    internal: true
    on_value:
      - script.execute: update_${name}_hot
  - platform: xplane_client
    dataref: "AirbusFBW/BrakeTemperatureArray"
    index: 1
    id: ${name}_t1
    internal: true
    on_value:
      - script.execute: update_${name}_hot
  - platform: xplane_client
    dataref: "AirbusFBW/BrakeTemperatureArray"
    index: 2
    id: ${name}_t2
    internal: true
    on_value:
      - script.execute: update_${name}_hot
  - platform: xplane_client
    dataref: "AirbusFBW/BrakeTemperatureArray"
    index: 3
    id: ${name}_t3
    internal: true
    on_value:
      - script.execute: update_${name}_hot

output:
  - platform: tlc5947
    id: ${name}_on_out
    channel: ${on_ch}
  - platform: tlc5947
    id: ${name}_hot_out
    channel: ${hot_ch}
