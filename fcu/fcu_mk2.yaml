                id: xp
                command: "sim/instruments/EFIS_2_pilot_sel_vor"

  # --- WX radar SYS selector (voltage-divided 3-pos: SYS1/OFF/SYS2) -> AirbusFBW/WXPowerSwitch ---
  # dref project order: 0 = SYS 1, 1 = OFF, 2 = SYS 2 (default.yaml). VERIFY against your switch.
  - platform: ads1115
    ads1115_id: ads2
    multiplexer: A0_GND
    gain: 6.144
    id: wx_sys_v
    name: "WX Radar SYS (V)"
    update_interval: 100ms
    filters:
      - median:
          window_size: 5
          send_every: 1 # emit every 100ms (was 7 = ~700ms lag), still median-of-5 smoothed
          send_first_at: 1
      - delta: 0.1 # dead-band: ignore sub-0.1V jitter (detents are ~0.9V apart)

  # Position 0..N-1 from the volts above. `delta: 0.5` = only fires when the position changes.
  - platform: copy
    source_id: wx_sys_v
    id: wx_sys
    name: "WX Radar SYS"
    accuracy_decimals: 0
    filters:
      - lambda: |-
          const float VMIN = 0.00f; // volts at position 0 (CHANGE_ME)
          const float VMAX = 3.28f; // volts at position 2 (CHANGE_ME)
          const int N = 3;
          int p = (int) roundf((x - VMIN) / (VMAX - VMIN) * (N - 1));
          return (float) (p < 0 ? 0 : (p > N - 1 ? N - 1 : p));
      - delta: 0.5
    on_value:
      - xplane_client.set_dataref:
          id: xp
          dataref: "AirbusFBW/WXPowerSwitch"
          value: !lambda "return (int) x;"

  # --- WX radar MODE selector (WX/WX+T/TURB/MAP): 4-pos ladder -> AirbusFBW/WXSwitchMode 0..3 ----
  - platform: ads1115
    ads1115_id: ads2
    multiplexer: A2_GND # was A1; park brake took A1
    gain: 6.144
    id: wx_mode_v
    name: "WX Radar Mode (V)"
    update_interval: 100ms
    filters:
      - median:
          window_size: 5
          send_every: 1 # emit every 100ms (was 7 = ~700ms lag), still median-of-5 smoothed
          send_first_at: 1
      - delta: 0.1 # dead-band: ignore sub-0.1V jitter (detents are ~0.9V apart)

  # Position 0..N-1 from the volts above. `delta: 0.5` = only fires when the position changes.
  - platform: copy
    source_id: wx_mode_v
    id: wx_mode
    name: "WX Radar Mode"
    accuracy_decimals: 0
    filters:
      - lambda: |-
          const float VMIN = 0.00f; // volts at position 0 (CHANGE_ME)
          const float VMAX = 3.28f; // volts at position 3 (CHANGE_ME)
          const int N = 4;
          int p = (int) roundf((x - VMIN) / (VMAX - VMIN) * (N - 1));
          return (float) (p < 0 ? 0 : (p > N - 1 ? N - 1 : p));
      - delta: 0.5
    on_value:
      - xplane_client.set_dataref:
          id: xp
          dataref: "AirbusFBW/WXSwitchMode"
          value: !lambda "return (int) x;"

  # --- XPDR/TCAS MODE selector (STBY/ALT/XPDR/TA/TA-RA): 5-pos ladder -> AirbusFBW/XPDRPower 0..4 -
  - platform: ads1115
    ads1115_id: ads2
    multiplexer: A3_GND # was A2; shifted by the park-brake move onto A1
    gain: 6.144
    id: xpdr_mode_v
    name: "XPDR Mode (V)"
    update_interval: 100ms
    filters:
      - median:
          window_size: 5
          send_every: 1 # emit every 100ms (was 7 = ~700ms lag), still median-of-5 smoothed
          send_first_at: 1
      - delta: 0.1 # dead-band: ignore sub-0.1V jitter (detents are ~0.9V apart)

  # Position 0..N-1 from the volts above. `delta: 0.5` = only fires when the position changes.
  - platform: copy
    source_id: xpdr_mode_v
    id: xpdr_mode
    name: "XPDR Mode"
    accuracy_decimals: 0
    filters:
      - lambda: |-
          const float VMIN = 0.00f; // volts at position 0 (CHANGE_ME)
          const float VMAX = 3.28f; // volts at position 4 (CHANGE_ME)
          const int N = 5;
          int p = (int) roundf((x - VMIN) / (VMAX - VMIN) * (N - 1));
          return (float) (p < 0 ? 0 : (p > N - 1 ? N - 1 : p));
      - delta: 0.5
    on_value:
      - xplane_client.set_dataref:
          id: xp
          dataref: "AirbusFBW/XPDRPower"
          value: !lambda "return (int) x;"

