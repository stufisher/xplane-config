# Reusable: one illuminated matrix pushbutton = press command + on/off STATUS lamp + BACKLIGHT.
# Normal polarity (HIGH on press). Include once per button via packages: with these vars:
#   name     unique slug (ids become <name>_btn / <name>_lt / <name>_stat_out / <name>_bk_out)
#   label    friendly name shown in HA
#   row,col  matrix position
#   command  X-Plane command fired on press
#   dataref  engaged-state dataref; status lamp is lit when it != 0
#   stat_ch  TLC channel for the status lamp
#   bk_ch    TLC channel for the backlight (driven by the shared brightness fan-out in the main file)
binary_sensor:
  - platform: matrix_keypad
    keypad_id: btn_matrix
    id: ${name}_btn
    name: ${label}
    row: ${row}
    col: ${col}
    on_press:
      - xplane_client.send_command:
          id: xp
          command: ${command}

sensor:
  - platform: xplane_client
    dataref: ${dataref}
    id: ${name}_lt
    internal: true
    on_value:
      - if:
          condition:
            lambda: "return x != 0;"
          then:
            - output.set_level:
                id: ${name}_stat_out
                level: 100%
          else:
            - output.set_level:
                id: ${name}_stat_out
                level: 0%

output:
  - platform: tlc5947
    id: ${name}_stat_out
    channel: ${stat_ch}
  - platform: tlc5947
    id: ${name}_bk_out
    channel: ${bk_ch}
