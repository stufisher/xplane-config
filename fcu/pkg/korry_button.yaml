# Reusable: an inverted (korry) matrix pushbutton = press command + on/off STATUS lamp, no backlight.
# INVERTED polarity (LOW on press -> `invert` filter). Vars:
#   name label row col command dataref stat_ch   (status lamp lit when dataref != 0)
binary_sensor:
  - platform: matrix_keypad
    keypad_id: btn_matrix
    id: ${name}_btn
    name: ${label}
    row: ${row}
    col: ${col}
    filters:
      - invert:
    on_press:
      - xplane_client.send_command:
          id: xp
          command: ${command}

sensor:
  - platform: xplane_client
    dataref: ${dataref}
    id: ${name}_lt
    internal: true
    on_value:
      - if:
          condition:
            lambda: "return x != 0;"
          then:
            - output.set_level:
                id: ${name}_stat_out
                level: 100%
          else:
            - output.set_level:
                id: ${name}_stat_out
                level: 0%

output:
  - platform: tlc5947
    id: ${name}_stat_out
    channel: ${stat_ch}
