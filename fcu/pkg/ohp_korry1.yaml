# Reusable: a korry pushbutton on one MCP23017 pin with a single status lamp (bottom legend only).
# Same wiring and <name>_set script convention as ohp_korry.yaml. Lamp state sensor is <name>_lt_b.
# Vars:
#   name label                 slug / HA name
#   mcp pin                    MCP23017 id and pin number (0-15)
#   inverted                   optional, default "true" (closed = pressed); "false" for open = pressed
#   dref_b idx_b cond_b ch_b   lamp: dataref, index (-1 = scalar), expr on `x`, TLC ch
# Block YAML only: a flow {} map can't hold a ${var} token.
defaults:
  inverted: "true"

binary_sensor:
  - platform: gpio
    id: ${name}_btn
    name: ${label}
    pin:
      mcp23xxx: ${mcp}
      number: ${pin}
      mode:
        input: true
        pullup: true
      inverted: ${inverted}
    filters:
      - delayed_on_off: 20ms
    on_state:
      - script.execute:
          id: ${name}_set
          pressed: !lambda "return x;"

sensor:
  - platform: xplane_client
    dataref: ${dref_b}
    index: ${idx_b}
    id: ${name}_lt_b
    internal: true
    on_value:
      - output.set_level:
          id: ${name}_b_out
          level: !lambda "return (${cond_b}) ? 1.0f : 0.0f;"

output:
  - platform: tlc5947
    id: ${name}_b_out
    channel: ${ch_b}
