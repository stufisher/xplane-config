esp32:
  board: esp32doit-devkit-v1

esphome:
  friendly_name: fcu_mk2
  name: fcu_mk2

debug:
  update_interval: 5s

external_components:
  - source: libs/home/components
    components: [xplane_client, mcp23017_encoder]

logger:
  # level: INFO
  level: DEBUG
  logs:
    sensor.adc: INFO
    ads1115.sensor: INFO
  # baud_rate: 0
  # baud_rate: 921600
  # tx_buffer_size: 2048

api:
  encryption:
    key: !secret nti_api_key

ota:
  password: !secret nti_ota
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none


xplane_client:
  id: xp
  # proxyed (default 8086)
  port: 8087
  on_websocket_connect:
    - lambda: 'id(xp_connected) = true;'
    - component.update: disp0
    - component.update: disp1
    - component.update: disp2
    - component.update: disp3
    - component.update: disp4
    - component.update: disp5
    - component.update: disp6
    - component.update: disp7
    - if:
        condition: { lambda: "return !isnan(id(nd_mode).state);" }
        then: [xplane_client.set_dataref: { id: xp, dataref: "AirbusFBW/NDmodeCapt",  value: !lambda "return (int) id(nd_mode).state;" }]
    - if:
        condition: { lambda: "return !isnan(id(nd_range).state);" }
        then: [xplane_client.set_dataref: { id: xp, dataref: "AirbusFBW/NDrangeCapt", value: !lambda "return (int) id(nd_range).state;" }]
    - if:
        condition: { lambda: "return !isnan(id(wx_mode).state);" }
        then: [xplane_client.set_dataref: { id: xp, dataref: "AirbusFBW/WXSwitchMode", value: !lambda "return (int) id(wx_mode).state;" }]
    - if:
        condition: { lambda: "return !isnan(id(xpdr_mode).state);" }
        then: [xplane_client.set_dataref: { id: xp, dataref: "AirbusFBW/XPDRPower",    value: !lambda "return (int) id(xpdr_mode).state;" }]
    - if:
        condition: { lambda: "return !isnan(id(wx_sys).state);" }
        then: [xplane_client.set_dataref: { id: xp, dataref: "AirbusFBW/WXPowerSwitch", value: !lambda "return (int) id(wx_sys).state;" }]
    # VOR/ADF 1 & 2 have per-position commands, not a dataref: send the one matching the knob.
    - if:
        condition: { lambda: "float v = id(voradf1_v).state; return !isnan(v) && (int) v == 0;" }
        then: [xplane_client.send_command: { id: xp, command: "sim/instruments/EFIS_1_pilot_sel_adf" }]
    - if:
        condition: { lambda: "float v = id(voradf1_v).state; return !isnan(v) && (int) v == 1;" }
        then: [xplane_client.send_command: { id: xp, command: "sim/instruments/EFIS_1_pilot_sel_off" }]
    - if:
        condition: { lambda: "float v = id(voradf1_v).state; return !isnan(v) && (int) v == 2;" }
        then: [xplane_client.send_command: { id: xp, command: "sim/instruments/EFIS_1_pilot_sel_vor" }]
    - if:
        condition: { lambda: "float v = id(voradf2_v).state; return !isnan(v) && (int) v == 0;" }
        then: [xplane_client.send_command: { id: xp, command: "sim/instruments/EFIS_2_pilot_sel_adf" }]
    - if:
        condition: { lambda: "float v = id(voradf2_v).state; return !isnan(v) && (int) v == 1;" }
        then: [xplane_client.send_command: { id: xp, command: "sim/instruments/EFIS_2_pilot_sel_off" }]
    - if:
        condition: { lambda: "float v = id(voradf2_v).state; return !isnan(v) && (int) v == 2;" }
        then: [xplane_client.send_command: { id: xp, command: "sim/instruments/EFIS_2_pilot_sel_vor" }]
    - if:
        condition: { lambda: "return id(parkbrake_sw).state;" }
        then: [xplane_client.send_command: { id: xp, command: "toliss_airbus/park_brake_set" }]
        else: [xplane_client.send_command: { id: xp, command: "toliss_airbus/park_brake_release" }]
                                                              
  on_websocket_disconnect:                                                                        
    - lambda: 'id(xp_connected) = false;'


i2c:
  - sda: GPIO27
    scl: GPIO25
    id: bus_a
    frequency: 800kHz

  - sda: GPIO21
    scl: GPIO19
    id: bus_b
    frequency: 800kHz

mcp23017_encoder:
  - i2c_id: bus_b
    id: mcp_enc
    address: 0x20
    interrupt_pin: GPIO32
    debounce: 0ms

  - i2c_id: bus_b
    id: mcp_enc_b
    address: 0x24
    interrupt_pin: GPIO26
    debounce: 0ms

mcp23017:
  - i2c_id: bus_b
    id: mcp_enc_inp_b
    address: 0x24

  - i2c_id: bus_b
    id: mcp_enc_inp
    address: 0x20

  - i2c_id: bus_b
    id: mcp_keypad
    address: 0x22

matrix_keypad:
  id: btn_matrix
  has_diodes: true
  rows:
    - pin: { mcp23xxx: mcp_keypad, number: 0, mode: { output: true } }
    - pin: { mcp23xxx: mcp_keypad, number: 1, mode: { output: true } }
    - pin: { mcp23xxx: mcp_keypad, number: 2, mode: { output: true } }
    - pin: { mcp23xxx: mcp_keypad, number: 3, mode: { output: true } }
    - pin: { mcp23xxx: mcp_keypad, number: 4, mode: { output: true } }
    - pin: { mcp23xxx: mcp_keypad, number: 5, mode: { output: true } }
    - pin: { mcp23xxx: mcp_keypad, number: 6, mode: { output: true } }
  columns:
    - pin: { mcp23xxx: mcp_keypad, number: 8,  mode: { input: true, pullup: true } }
    - pin: { mcp23xxx: mcp_keypad, number: 9,  mode: { input: true, pullup: true } }
    - pin: { mcp23xxx: mcp_keypad, number: 10, mode: { input: true, pullup: true } }
    - pin: { mcp23xxx: mcp_keypad, number: 11, mode: { input: true, pullup: true } }
    - pin: { mcp23xxx: mcp_keypad, number: 12, mode: { input: true, pullup: true } }
    - pin: { mcp23xxx: mcp_keypad, number: 13, mode: { input: true, pullup: true } }
    - pin: { mcp23xxx: mcp_keypad, number: 14, mode: { input: true, pullup: true } }
  on_key:
    - lambda: ESP_LOGI("KEY", "key %d pressed", x);

tlc5947:
  id: tlc
  data_pin: GPIO04
  clock_pin: GPIO17
  lat_pin: GPIO18
  num_chips: 2

ads1115:
  - address: 0x48
    id: ads1
    i2c_id: bus_b
  - address: 0x49
    id: ads2
    i2c_id: bus_b


