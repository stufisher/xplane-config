        pullup: true
      inverted: true
    on_press: 
      then:
        - xplane_client.send_command:
            id: xp
            command: "AirbusFBW/RMPSwapCapt"

  - platform: gpio
    name: "BARO Unit"
    pin:
      mcp23xxx: mcp_enc_inp_b
      number: 10
      mode:
        input: true
        pullup: true
      inverted: true
    on_press: 
      then:
        - xplane_client.set_dataref:
            id: xp
            dataref: "AirbusFBW/BaroUnitCapt"
            value: 1
    on_release: 
      then:
        - xplane_client.set_dataref:
            id: xp
            dataref: "AirbusFBW/BaroUnitCapt"
            value: 0


  - platform: gpio
    name: "Metric Button"
    pin:
      mcp23xxx: mcp_enc_inp_b
      number: 12
      mode:
        input: true
        pullup: true
      inverted: true
    on_press: 
      then:
        - xplane_client.send_command:
            id: xp
            command: "toliss_airbus/metric_alt_button_push"

  - platform: gpio
    name: "HDKTRK Button"
    pin:
      mcp23xxx: mcp_enc_inp_b
      number: 13
      mode:
        input: true
        pullup: true
      inverted: true
    on_press: 
      then:
        - xplane_client.send_command:
            id: xp
            command: "toliss_airbus/hdgtrk_button_push"

  - platform: gpio
    name: "SPD_MACH Button"
    pin:
      mcp23xxx: mcp_enc_inp_b
      number: 14
      mode:
        input: true
        pullup: true
      inverted: true
    on_press: 
      then:
        - xplane_client.send_command:
            id: xp
            command: "toliss_airbus/ias_mach_button_push"

  - platform: gpio
    name: "LDG Up Down"
    pin:
      mcp23xxx: mcp_enc_inp_b
      number: 15
      mode:
        input: true
        pullup: true
      inverted: true
    on_press: 
      then:
        - xplane_client.send_command:
            id: xp
            command: "sim/flight_controls/landing_gear_up"
    on_release: 
      then:
        - xplane_client.send_command:
            id: xp
            command: "sim/flight_controls/landing_gear_down"

  - platform: matrix_keypad
    keypad_id: btn_matrix
    id: master_warn_btn
    name: "Master WARN Clr"
    row: 6
    col: 0
    on_press: [ xplane_client.send_command: { id: xp, command: "sim/annunciator/clear_master_warning" } ]
  - platform: matrix_keypad
    keypad_id: btn_matrix
    id: master_caut_btn
    name: "Master CAUT Clr"
    row: 5
    col: 0
    on_press: [ xplane_client.send_command: { id: xp, command: "sim/annunciator/clear_master_caution" } ]

  - platform: matrix_keypad
    keypad_id: btn_matrix
    id: call_flash
    internal: true
    row: 1
    col: 5
    on_press:
      - script.execute: flash_call

  # --- Park brake: ads2 A1 analog input read as binary (~3.28V = ON/set, ~0V = OFF/release) -----
  - platform: analog_threshold
    id: parkbrake_sw
    name: "Park Brake SW"
    sensor_id: parkbrake_v
    threshold:
      upper: 3.0 # > 2.0V -> ON (set); gap to lower = hysteresis against jitter near mid-scale
      lower: 2.8 # < 1.0V -> OFF (release)
    on_release:
      - xplane_client.send_command:
          id: xp
          command: "toliss_airbus/park_brake_set"
    on_press:
      - xplane_client.send_command:
          id: xp
          command: "toliss_airbus/park_brake_release"

output:
  - { platform: tlc5947, id: master_warn_out, channel: 6 }
  - { platform: tlc5947, id: master_caut_out, channel: 7 }
  - { platform: tlc5947, id: exped_stat_out, channel: 15 }
  - { platform: tlc5947, id: call_stat_out, channel: 5 }

light:
  - platform: monochromatic
    id: master_warn_led
    name: "Master WARN"
    output: master_warn_out
    default_transition_length: 0s
    effects:
      - strobe:
          name: Flash
          colors:
            - state: true
              brightness: 100%
              duration: 250ms
            - state: false
              duration: 250ms
  - platform: monochromatic
    id: master_caut_led
    name: "Master CAUT"
    output: master_caut_out
    default_transition_length: 0s